name: GitHub App Bot Identity
description: Looks up a GitHub App bot's name and email to commit as, and optionally sets them as the git user.

inputs:
  app-slug:
    description: 'The app slug, e.g. the app-slug output of actions/create-github-app-token'
    required: true
  token:
    description: 'Token for the user lookup, which needs no permissions'
    required: true
  configure-git:
    description: 'Set the bot as the global git user.name and user.email'
    default: 'false'

outputs:
  name:
    description: 'The bot username, e.g. my-app[bot]'
    value: ${{ steps.bot.outputs.name }}
  email:
    description: 'The bot noreply email'
    value: ${{ steps.bot.outputs.email }}
  id:
    description: 'The bot user ID'
    value: ${{ steps.bot.outputs.id }}

runs:
  using: composite

  steps:
    - name: Look up the bot user
      id: bot
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        APP_SLUG: ${{ inputs.app-slug }}
      run: |
        name="${APP_SLUG}[bot]"
        id="$(gh api "/users/${name}" --jq .id)"
        {
          echo "name=${name}"
          echo "email=${id}+${name}@users.noreply.github.com"
          echo "id=${id}"
        } >> "${GITHUB_OUTPUT}"

    - name: Configure git user
      if: ${{ inputs.configure-git == 'true' }}
      shell: bash
      env:
        BOT_NAME: ${{ steps.bot.outputs.name }}
        BOT_EMAIL: ${{ steps.bot.outputs.email }}
      run: |
        git config --global user.name "${BOT_NAME}"
        git config --global user.email "${BOT_EMAIL}"
