minimumReleaseAge: 1440 # 1 day

# The cooling-off period buys nothing against our own packages.
minimumReleaseAgeExclude:
  - '@marcalexiei/oxfmt-config'
  - '@marcalexiei/oxlint-config'

autoDedupe: true

# Records autoDedupe in the lockfile, so installs that are not frozen do not resolve again.
lockfile:
  includeResolutionSettings: true
