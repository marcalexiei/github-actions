name: Pin README version
description: Points the `uses:` lines in the given files at the commit a release tag was cut from. Run it after actions/checkout.

inputs:
  tag:
    description: 'The release tag to pin, e.g. `v1.2.3`'
    required: true
  files:
    description: 'Space-separated files or globs to rewrite'
    default: 'README.md'
  repository:
    description: 'The `owner/repo` whose `uses:` lines are pinned'
    default: ${{ github.repository }}

outputs:
  sha:
    description: 'The commit the tag points at'
    value: ${{ steps.pin.outputs.sha }}

runs:
  using: composite

  steps:
    - name: Pin the examples
      id: pin
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        FILES: ${{ inputs.files }}
        REPO: ${{ inputs.repository }}
      run: |
        # Strict, since the tag lands in the sed script below.
        if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::${TAG} is not a vX.Y.Z release tag."
          exit 1
        fi

        git fetch --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
        sha="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
        echo "sha=${sha}" >> "$GITHUB_OUTPUT"

        # Matches `@v0`, `@<sha>` and `@<sha> # vX.Y.Z` alike.
        # shellcheck disable=SC2086 # `files` takes globs
        sed -i -E "s|(uses: ${REPO}(/[^@[:space:]]+)?@)[^[:space:]]+( #.*)?$|\1${sha} # ${TAG}|" ${FILES}
