name: Setup GitHub App Bot User
description: Creates a GitHub App installation token, and the bot's name and email to commit as.

inputs:
  client-id:
    description: 'App client ID'
    required: true
  private-key:
    description: 'App private key'
    required: true

outputs:
  token:
    description: 'The generated GitHub App installation token'
    value: ${{ steps.app-token.outputs.token }}
  bot-name:
    description: 'The GitHub App bot username'
    value: ${{ steps.app-token.outputs.app-slug }}[bot]
  bot-email:
    description: 'The GitHub App bot email'
    value: ${{ steps.app-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
  bot-id:
    description: 'The GitHub App user ID'
    value: ${{ steps.app-user-id.outputs.user-id }}

runs:
  using: composite

  steps:
    - name: Create access token for GitHub App
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0 # zizmor: ignore[github-app] -- callers are responsible for granting the app only the minimum required permissions
      id: app-token
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}

    - name: Get GitHub App User ID
      shell: sh
      id: app-user-id
      run: echo "user-id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
