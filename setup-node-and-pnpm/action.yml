name: Setup Node.js + PNPM and install Dependencies
description: |
  This is a composite GitHub Action that:
  - Sets up pnpm package manager
  - Configures Node.js environment
  - Installs project dependencies, caching pnpm, the Node.js binary and node_modules

inputs:
  node-version:
    description: 'Explicit node version. Otherwise fallback reading `.nvmrc`'
  save-cache:
    description: 'Save the caches after a miss, which only ever happens on the default branch. Set to `false` in all but one of the parallel jobs sharing a lockfile, so they do not race for the same keys'
    default: 'true'

outputs:
  cache-hit:
    description: 'Whether node_modules was restored from the cache (install skipped)'
    value: ${{ steps.node-modules.outputs.cache-hit == 'true' }}

runs:
  using: composite

  steps:
    - name: Resolve versions
      id: versions
      shell: bash
      env:
        NODE_VERSION: ${{ inputs.node-version }}
        # Pull requests can read the default branch's caches, but not each other's.
        SAVE: ${{ inputs.save-cache == 'true' && github.ref_name == github.event.repository.default_branch }}
      run: |
        if [ ! -f package.json ]; then
          echo "::error::package.json was not found in the repository root. Run actions/checkout before this action."
          exit 1
        fi
        pm=$(jq -r '.packageManager // ""' package.json)
        if [ -z "$pm" ]; then
          echo "::error::The 'packageManager' field is missing from package.json. Set it to e.g. \"pnpm@10.33.4\"."
          exit 1
        fi
        case "$pm" in
          pnpm@*) ;;
          *)
            echo "::error::The 'packageManager' field in package.json is not pnpm (got: $pm)."
            exit 1
            ;;
        esac
        pnpm="${pm%%+*}"

        node="${NODE_VERSION:-$(tr -d '[:space:]' < .nvmrc)}"
        node="${node#v}"
        # A range would pin the cached binary to whatever patch was saved first.
        [[ "$node" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && exact="$node" || exact=''
        # The runner image already ships it, and finds it faster than a cache restores it.
        [[ -d "$RUNNER_TOOL_CACHE/node/$exact" ]] && exact=''

        # Not pnpm on Windows, where pnpm/action-setup lays it out differently.
        key="$RUNNER_OS-$RUNNER_ARCH-tools"
        paths=''
        if [ "$RUNNER_OS" != Windows ]; then
          key+="-$pnpm"
          paths="$HOME/setup-pnpm"
        fi
        if [ -n "$exact" ]; then
          key+="-node$exact"
          paths+="${paths:+$'\n'}$RUNNER_TOOL_CACHE/node/$exact"
        fi

        {
          echo "pnpm=$pnpm"
          echo "node=$node"
          echo "save=$SAVE"
          echo "tools-key=$key"
          [ -z "$paths" ] || printf 'tools-paths<<EOF\n%s\nEOF\n' "$paths"
        } >> "$GITHUB_OUTPUT"

    # One entry for pnpm and Node.js: a restore's lookup can cost as much as its download.
    # pnpm/action-setup downloads pnpm twice per run, and setup-node every version the image lacks.
    - name: Restore pnpm and Node.js
      id: tools
      if: ${{ steps.versions.outputs.tools-paths != '' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.versions.outputs.tools-paths }}
        key: ${{ steps.versions.outputs.tools-key }}

    # Sets PATH and PNPM_HOME the way pnpm/action-setup does for its default `dest`.
    - name: Use the restored pnpm
      id: pnpm-restored
      if: ${{ runner.os != 'Windows' && steps.tools.outputs.cache-hit == 'true' }}
      shell: bash
      env:
        VERSION: ${{ steps.versions.outputs.pnpm }}
      run: | # zizmor: ignore[github-env] -- fixed paths, and only the default branch saves this cache
        home="$HOME/setup-pnpm/node_modules/.bin"
        # A restore that does not run falls back to pnpm/action-setup.
        actual="$(PNPM_HOME="$home" PATH="$home/bin:$home:$PATH" pnpm --version 2>/dev/null || true)"
        if [ "pnpm@${actual}" != "$VERSION" ]; then
          echo "::warning::The restored pnpm reports '${actual}', not ${VERSION#pnpm@}. Installing it instead."
          exit 0
        fi
        echo "$home" >> "$GITHUB_PATH"
        echo "$home/bin" >> "$GITHUB_PATH"
        echo "PNPM_HOME=$home" >> "$GITHUB_ENV"
        echo "ok=true" >> "$GITHUB_OUTPUT"

    - name: Install pnpm
      if: ${{ steps.pnpm-restored.outputs.ok != 'true' }}
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

    - name: Resolve node_modules paths
      id: resolve
      shell: bash
      run: |
        {
          echo 'node-modules<<EOF'
          pnpm ls -r --depth -1 --json | jq -r '.[].path + "/node_modules"'
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    # A hit skips `pnpm install`. Not on Windows: tar does not round-trip pnpm's junctions.
    # After a lockfile change, `pnpm install` only fetches what the older node_modules lacks.
    - name: Restore node_modules
      id: node-modules
      if: ${{ runner.os != 'Windows' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.resolve.outputs.node-modules }}
        key: ${{ runner.os }}-${{ runner.arch }}-node-modules-node${{ steps.versions.outputs.node }}-${{ steps.versions.outputs.pnpm }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-node-modules-node${{ steps.versions.outputs.node }}-${{ steps.versions.outputs.pnpm }}-

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.versions.outputs.node }}
        package-manager-cache: false
        registry-url: 'https://registry.npmjs.org'

    # Before `pnpm install` adds packages to the store under PNPM_HOME.
    - name: Save pnpm and Node.js
      if: ${{ steps.versions.outputs.tools-paths != '' && steps.tools.outputs.cache-hit != 'true' && steps.versions.outputs.save == 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.versions.outputs.tools-paths }}
        key: ${{ steps.versions.outputs.tools-key }}

    - name: Install Dependencies
      if: ${{ steps.node-modules.outputs.cache-hit != 'true' }}
      shell: bash
      run: pnpm install --frozen-lockfile

    # Before any later step writes into node_modules (e.g. `.vite`).
    - name: Save node_modules
      if: ${{ runner.os != 'Windows' && steps.node-modules.outputs.cache-hit != 'true' && steps.versions.outputs.save == 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.resolve.outputs.node-modules }}
        key: ${{ steps.node-modules.outputs.cache-primary-key }}
