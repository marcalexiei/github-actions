name: Setup Node.js + PNPM and install Dependencies
description: |
  This is a composite GitHub Action that:
  - Sets up pnpm package manager
  - Configures Node.js environment
  - Installs project dependencies, caching node_modules and the Node.js binary

inputs:
  node-version:
    description: 'Explicit node version. Otherwise fallback reading `.nvmrc`'
  save-cache:
    description: 'Save the caches after a miss, which only ever happens on the default branch. Set to `false` in all but one of the parallel jobs sharing a lockfile, so they do not race for the same keys'
    default: 'true'

outputs:
  cache-hit:
    description: 'Whether node_modules was restored from the cache (install skipped)'
    value: ${{ steps.node-modules.outputs.cache-hit == 'true' }}

runs:
  using: composite

  steps:
    - name: Validate packageManager in package.json
      id: package-manager
      shell: bash
      run: |
        if [ ! -f package.json ]; then
          echo "::error::package.json was not found in the repository root. Run actions/checkout before this action."
          exit 1
        fi
        pm=$(jq -r '.packageManager // ""' package.json)
        if [ -z "$pm" ]; then
          echo "::error::The 'packageManager' field is missing from package.json. Set it to e.g. \"pnpm@10.33.4\"."
          exit 1
        fi
        case "$pm" in
          pnpm@*) ;;
          *)
            echo "::error::The 'packageManager' field in package.json is not pnpm (got: $pm)."
            exit 1
            ;;
        esac
        echo "version=${pm%%+*}" >> "$GITHUB_OUTPUT"

    # pnpm/action-setup downloads pnpm twice per run: its bundled version, then the packageManager one.
    - name: Restore pnpm
      id: pnpm-binary
      if: ${{ runner.os != 'Windows' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/setup-pnpm
        key: ${{ runner.os }}-${{ runner.arch }}-pnpm-binary-${{ steps.package-manager.outputs.version }}

    # Sets PATH and PNPM_HOME the way pnpm/action-setup does for its default `dest`.
    - name: Use the restored pnpm
      id: pnpm-restored
      if: ${{ steps.pnpm-binary.outputs.cache-hit == 'true' }}
      shell: bash
      env:
        VERSION: ${{ steps.package-manager.outputs.version }}
      run: | # zizmor: ignore[github-env] -- fixed paths, and only the default branch saves this cache
        home="$HOME/setup-pnpm/node_modules/.bin"
        # A restore that does not run falls back to pnpm/action-setup.
        actual="$(PNPM_HOME="$home" PATH="$home/bin:$home:$PATH" pnpm --version 2>/dev/null || true)"
        if [ "pnpm@${actual}" != "$VERSION" ]; then
          echo "::warning::The restored pnpm reports '${actual}', not ${VERSION#pnpm@}. Installing it instead."
          exit 0
        fi
        echo "$home" >> "$GITHUB_PATH"
        echo "$home/bin" >> "$GITHUB_PATH"
        echo "PNPM_HOME=$home" >> "$GITHUB_ENV"
        echo "ok=true" >> "$GITHUB_OUTPUT"

    - name: Install pnpm
      if: ${{ steps.pnpm-restored.outputs.ok != 'true' }}
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Resolve cache keys and paths
      id: resolve
      shell: bash
      env:
        NODE_VERSION: ${{ inputs.node-version }}
        # Pull requests can read the default branch's caches, but not each other's.
        SAVE: ${{ inputs.save-cache == 'true' && github.ref_name == github.event.repository.default_branch }}
      run: |
        version="${NODE_VERSION:-$(tr -d '[:space:]' < .nvmrc)}"
        version="${version#v}"
        # A range would pin the cached binary to whatever patch was saved first.
        [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && exact="$version" || exact=''
        # The runner image already ships it, and finds it faster than a cache restores it.
        [[ -d "$RUNNER_TOOL_CACHE/node/$exact" ]] && exact=''
        {
          echo "node-version=$version"
          echo "node-exact=$exact"
          echo "save=$SAVE"
          echo 'node-modules<<EOF'
          pnpm ls -r --depth -1 --json | jq -r '.[].path + "/node_modules"'
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    # Before `pnpm install` adds packages to the store under PNPM_HOME.
    - name: Save pnpm
      if: ${{ runner.os != 'Windows' && steps.pnpm-binary.outputs.cache-hit != 'true' && steps.resolve.outputs.save == 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/setup-pnpm
        key: ${{ steps.pnpm-binary.outputs.cache-primary-key }}

    # A hit skips `pnpm install`. Not on Windows: tar does not round-trip pnpm's junctions.
    # After a lockfile change, `pnpm install` only fetches what the older node_modules lacks.
    - name: Restore node_modules
      id: node-modules
      if: ${{ runner.os != 'Windows' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.resolve.outputs.node-modules }}
        key: ${{ runner.os }}-${{ runner.arch }}-node-modules-node${{ steps.resolve.outputs.node-version }}-${{ steps.package-manager.outputs.version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-node-modules-node${{ steps.resolve.outputs.node-version }}-${{ steps.package-manager.outputs.version }}-

    # setup-node downloads every version the runner image doesn't ship.
    - name: Restore Node.js
      id: node-binary
      if: ${{ steps.resolve.outputs.node-exact != '' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.tool_cache }}/node/${{ steps.resolve.outputs.node-exact }}
        key: ${{ runner.os }}-${{ runner.arch }}-node-binary-${{ steps.resolve.outputs.node-exact }}

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ steps.resolve.outputs.node-version }}
        package-manager-cache: false
        registry-url: 'https://registry.npmjs.org'

    - name: Save Node.js
      if: ${{ steps.resolve.outputs.node-exact != '' && steps.node-binary.outputs.cache-hit != 'true' && steps.resolve.outputs.save == 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.tool_cache }}/node/${{ steps.resolve.outputs.node-exact }}
        key: ${{ steps.node-binary.outputs.cache-primary-key }}

    - name: Install Dependencies
      if: ${{ steps.node-modules.outputs.cache-hit != 'true' }}
      shell: bash
      run: pnpm install --frozen-lockfile

    # Before any later step writes into node_modules (e.g. `.vite`).
    - name: Save node_modules
      if: ${{ runner.os != 'Windows' && steps.node-modules.outputs.cache-hit != 'true' && steps.resolve.outputs.save == 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.resolve.outputs.node-modules }}
        key: ${{ steps.node-modules.outputs.cache-primary-key }}
