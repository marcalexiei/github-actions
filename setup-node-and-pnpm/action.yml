name: Setup Node.js + PNPM and install Dependencies
description: Sets up pnpm and Node.js, and installs the dependencies, caching the Node.js binary and `node_modules`.

inputs:
  node-version:
    description: 'The Node.js version. Defaults to `.nvmrc`'
  save-cache:
    description: 'Save the cache on the default branch. Set to `false` in all but one of the parallel jobs sharing a lockfile'
    default: 'true'

outputs:
  cache-hit:
    description: 'Whether node_modules was restored from the cache (install skipped)'
    value: ${{ runner.os != 'Windows' && steps.deps.outputs.cache-hit == 'true' }}

runs:
  using: composite

  steps:
    - name: Resolve versions
      id: versions
      shell: bash
      env:
        NODE_VERSION: ${{ inputs.node-version }}
        # Pull requests can read the default branch's caches, but not each other's.
        SAVE: ${{ inputs.save-cache == 'true' && github.ref_name == github.event.repository.default_branch }}
      run: |
        pm="$(jq -r '.packageManager // ""' package.json || true)"
        if [[ "$pm" != pnpm@* ]]; then
          echo "::error::Set 'packageManager' in package.json to pnpm, e.g. \"pnpm@12.21.0\" (got: '$pm'). Run actions/checkout before this action."
          exit 1
        fi
        pnpm="${pm%%+*}"

        node="${NODE_VERSION:-$(tr -d '[:space:]' < .nvmrc)}"
        node="${node#v}"
        # A range would pin the cached binary to whatever patch was saved first.
        [[ "$node" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && exact="$node" || exact=''
        # The runner image already ships it, and finds it faster than a cache restores it.
        [[ -d "$RUNNER_TOOL_CACHE/node/$exact" ]] && exact=''

        # One entry for the Node.js binary and node_modules: a restore's lookup can cost as much as its download.
        # Not node_modules on Windows: tar does not round-trip pnpm's junctions.
        # `pnpm-home`: node_modules is tied to its store, under the PNPM_HOME that `Install pnpm` sets.
        key="$RUNNER_OS-$RUNNER_ARCH-deps-pnpm-home-node$node-$pnpm"
        paths=''
        [ -n "$exact" ] && paths="$RUNNER_TOOL_CACHE/node/$exact"
        if [ "$RUNNER_OS" != Windows ]; then
          paths+="${paths:+$'\n'}$(awk -f "$GITHUB_ACTION_PATH/importers.awk" pnpm-lock.yaml | sort -u)"
          echo "deps-restore-key=$key-" >> "$GITHUB_OUTPUT"
          key+="-$(cat pnpm-lock.yaml pnpm-workspace.yaml 2>/dev/null | openssl dgst -sha256 -r | cut -c1-64)"
        fi

        {
          echo "pnpm-version=${pnpm#pnpm@}"
          echo "node=$node"
          echo "save=$SAVE"
          echo "deps-key=$key"
          [ -z "$paths" ] || printf 'deps-paths<<EOF\n%s\nEOF\n' "$paths"
        } >> "$GITHUB_OUTPUT"

    # A hit skips `pnpm install`.
    # After a lockfile change, `pnpm install` only fetches what the older node_modules lacks.
    - name: Restore Node.js and node_modules
      id: deps
      if: ${{ steps.versions.outputs.deps-paths != '' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.versions.outputs.deps-paths }}
        key: ${{ steps.versions.outputs.deps-key }}
        restore-keys: ${{ steps.versions.outputs.deps-restore-key }}

    # Not pnpm/setup: it saves a cache in every job, which parallel jobs race for.
    - name: Install pnpm
      shell: bash
      env:
        VERSION: ${{ steps.versions.outputs.pnpm-version }}
      run: | # zizmor: ignore[github-env] -- a path under the runner's tool cache, named after the pinned version
        if [ "${VERSION%%.*}" -lt 12 ]; then
          echo "::error::pnpm 12 or later is required (got: $VERSION)."
          exit 1
        fi
        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64) platform=linux-x64 ;;
          Linux-ARM64) platform=linux-arm64 ;;
          macOS-X64) platform=darwin-x64 ;;
          macOS-ARM64) platform=darwin-arm64 ;;
          Windows-X64) platform=win32-x64 ext=.exe ;;
          Windows-ARM64) platform=win32-arm64 ext=.exe ;;
          *)
            echo "::error::pnpm ships no binary for $RUNNER_OS-$RUNNER_ARCH."
            exit 1
            ;;
        esac
        # musl's ldd exits 1 on `--version`, which pipefail would turn into "not musl".
        if [ "$RUNNER_OS" = Linux ] && [[ "$(ldd --version 2>&1 || true)" == *musl* ]]; then platform+=-musl; fi

        meta="$(curl -fsSL --retry 3 "https://registry.npmjs.org/@pnpm/exe.$platform/$VERSION")"
        tgz="$RUNNER_TEMP/pnpm.tgz"
        curl -fsSL --retry 3 -o "$tgz" "$(jq -r .dist.tarball <<< "$meta")"
        integrity="$(jq -r .dist.integrity <<< "$meta")"
        if [ "sha512-$(openssl dgst -sha512 -binary "$tgz" | openssl base64 -A)" != "$integrity" ]; then
          echo "::error::@pnpm/exe.$platform@$VERSION does not match the integrity the registry lists."
          exit 1
        fi

        # npm's signing key, from registry.npmjs.org/-/npm/v1/keys: pinned, so the registry cannot vouch for itself.
        keyid='SHA256:DhQ8wR5APBvFHLF/+Tc+AYvPOdTpcIDqOhxsBHRwC7U'
        printf -- '-----BEGIN PUBLIC KEY-----\n%s\n-----END PUBLIC KEY-----\n' \
          'MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEY6Ya7W++7aUPzvMTrezH6Ycx3c+HOKYCcNGybJZSCJq/fd7Qa8uuAKtdIkUQtQiEKERhAmE5lMMJhP8OkDOa2g==' \
          > "$RUNNER_TEMP/npm-key.pem"
        jq -r --arg keyid "$keyid" '.dist.signatures[]? | select(.keyid == $keyid) | .sig' <<< "$meta" \
          | openssl base64 -d -A > "$RUNNER_TEMP/pnpm.sig"
        if ! printf '%s' "@pnpm/exe.$platform@$VERSION:$integrity" \
          | openssl dgst -sha256 -verify "$RUNNER_TEMP/npm-key.pem" -signature "$RUNNER_TEMP/pnpm.sig" > /dev/null; then
          echo "::error::@pnpm/exe.$platform@$VERSION does not carry npm's signature."
          exit 1
        fi

        dir="$RUNNER_TOOL_CACHE/pnpm/$VERSION/$platform"
        # `bin`: where `pnpm add -g` links, which refuses to run unless it is on PATH.
        mkdir -p "$dir/bin"
        # From stdin: GNU tar reads the `D:` of a Windows path as a remote host.
        tar -xzf - -C "$dir" --strip-components=1 "package/pnpm$ext" < "$tgz"
        # Like pnpm's own install: the binary acts on the name it runs as.
        for name in pn pnpx pnx; do ln -f "$dir/pnpm$ext" "$dir/$name$ext"; done
        printf '%s\n' "$dir" "$dir/bin" >> "$GITHUB_PATH"
        echo "PNPM_HOME=$dir" >> "$GITHUB_ENV"

    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.versions.outputs.node }}
        package-manager-cache: false
        registry-url: 'https://registry.npmjs.org'

    - name: Install Dependencies
      if: ${{ runner.os == 'Windows' || steps.deps.outputs.cache-hit != 'true' }}
      shell: bash
      run: pnpm install --frozen-lockfile

    # Before any later step writes into node_modules (e.g. `.vite`).
    - name: Save Node.js and node_modules
      if: ${{ steps.versions.outputs.deps-paths != '' && steps.deps.outputs.cache-hit != 'true' && steps.versions.outputs.save == 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.versions.outputs.deps-paths }}
        key: ${{ steps.versions.outputs.deps-key }}
