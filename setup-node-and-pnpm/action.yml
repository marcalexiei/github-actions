name: Setup Node.js + PNPM and install Dependencies
description: |
  This is a composite GitHub Action that:
  - Sets up pnpm package manager
  - Configures Node.js environment
  - Installs project dependencies, caching node_modules and the Node.js binary

inputs:
  node-version:
    description: 'Explicit node version. Otherwise fallback reading `.nvmrc`'
  save-cache:
    description: 'Save the caches after a miss, which only ever happens on the default branch. Set to `false` in all but one of the parallel jobs sharing a lockfile, so they do not race for the same keys'
    default: 'true'

outputs:
  cache-hit:
    description: 'Whether node_modules was restored from the cache (install skipped)'
    value: ${{ steps.node-modules.outputs.cache-hit == 'true' }}

runs:
  using: composite

  steps:
    - name: Validate packageManager in package.json
      shell: bash
      run: |
        if [ ! -f package.json ]; then
          echo "::error::package.json was not found in the repository root. Run actions/checkout before this action."
          exit 1
        fi
        pm=$(jq -r '.packageManager // ""' package.json)
        if [ -z "$pm" ]; then
          echo "::error::The 'packageManager' field is missing from package.json. Set it to e.g. \"pnpm@10.33.4\"."
          exit 1
        fi
        case "$pm" in
          pnpm@*) ;;
          *)
            echo "::error::The 'packageManager' field in package.json is not pnpm (got: $pm)."
            exit 1
            ;;
        esac

    # standalone: true makes pnpm/action-setup install @pnpm/exe (a Node-bundled
    # binary), so the bootstrap pnpm runs regardless of the runner's system Node.
    # With no `version` input, the action then reads `packageManager` from
    # package.json and pnpm auto-switches to that version at install time.
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        standalone: true

    - name: Resolve cache keys and paths
      id: resolve
      shell: bash
      env:
        NODE_VERSION: ${{ inputs.node-version }}
        # Pull requests can read the default branch's caches, but not each other's.
        SAVE: ${{ inputs.save-cache == 'true' && github.ref_name == github.event.repository.default_branch }}
      run: |
        version="${NODE_VERSION:-$(tr -d '[:space:]' < .nvmrc)}"
        version="${version#v}"
        # A range would pin the cached binary to whatever patch was saved first.
        [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && exact="$version" || exact=''
        {
          echo "node-version=$version"
          echo "node-exact=$exact"
          echo "save=$SAVE"
          echo "pnpm-version=$(jq -r '.packageManager | split("+")[0]' package.json)"
          echo 'node-modules<<EOF'
          pnpm ls -r --depth -1 --json | jq -r '.[].path + "/node_modules"'
          echo 'EOF'
        } >> "$GITHUB_OUTPUT"

    # A hit skips `pnpm install`. Not on Windows: tar does not round-trip pnpm's junctions.
    - name: Restore node_modules
      id: node-modules
      if: runner.os != 'Windows'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.resolve.outputs.node-modules }}
        key: ${{ runner.os }}-${{ runner.arch }}-node-modules-node${{ steps.resolve.outputs.node-version }}-${{ steps.resolve.outputs.pnpm-version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

    # setup-node downloads every version the runner image doesn't ship.
    - name: Restore Node.js
      id: node-binary
      if: steps.resolve.outputs.node-exact != ''
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.tool_cache }}/node/${{ steps.resolve.outputs.node-exact }}
        key: ${{ runner.os }}-${{ runner.arch }}-node-binary-${{ steps.resolve.outputs.node-exact }}

    - name: Setup Node.js (via input)
      if: ${{ inputs.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false
        registry-url: 'https://registry.npmjs.org'

    - name: Setup Node.js (via .nvmrc)
      if: ${{ !inputs.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: '.nvmrc'
        package-manager-cache: false
        registry-url: 'https://registry.npmjs.org'

    - name: Save Node.js
      if: steps.resolve.outputs.node-exact != '' && steps.node-binary.outputs.cache-hit != 'true' && steps.resolve.outputs.save == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.tool_cache }}/node/${{ steps.resolve.outputs.node-exact }}
        key: ${{ steps.node-binary.outputs.cache-primary-key }}

    - name: Install Dependencies
      if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm install --frozen-lockfile

    # Before any later step writes into node_modules (e.g. `.vite`).
    - name: Save node_modules
      if: runner.os != 'Windows' && steps.node-modules.outputs.cache-hit != 'true' && steps.resolve.outputs.save == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.resolve.outputs.node-modules }}
        key: ${{ steps.node-modules.outputs.cache-primary-key }}
