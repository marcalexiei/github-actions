name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Code checks
    timeout-minutes: 5
    runs-on: ubuntu-26.04
    permissions:
      contents: read # required to check out the repository

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dependencies
        uses: $/setup-node-and-pnpm

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint:ci

      - name: Test
        run: pnpm run test

  setup-node-and-pnpm:
    name: setup-node-and-pnpm on ${{ matrix.os }}
    timeout-minutes: 10
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # required to check out the repository
    strategy:
      matrix:
        os: [macos-26, windows-2025]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Dependencies
        uses: $/setup-node-and-pnpm
        with:
          save-cache: false

      - name: Run each pnpm name
        run: for name in pnpm pn pnpx pnx; do "$name" --version; done

  github-actions-audit:
    name: GitHub Actions audit
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read # required to check out the repository
    steps:
      - name: Audit GitHub Actions
        uses: $/audit-github-actions
        with:
          paths: .github */action.yml

  ci-ok:
    name: CI OK
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    if: ${{ always() }}
    needs:
      - checks
      - setup-node-and-pnpm
      - github-actions-audit
    permissions:
      actions: read # required to list the run's jobs
      contents: read # required to read the workflow file
    steps:
      - name: Check needed jobs
        uses: $/check-needs
        with:
          needs: ${{ toJSON(needs) }}
