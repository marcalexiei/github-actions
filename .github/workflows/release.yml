name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release
    environment: release

    runs-on: ubuntu-26.04

    timeout-minutes: 5

    permissions:
      contents: read # the app token, not GITHUB_TOKEN, does the writing

    # release-please works through the API, so there is nothing to check out or commit locally.
    steps:
      - name: Setup release helper
        id: release-helper
        uses: $/setup-github-app-user-bot
        with:
          client-id: ${{ vars.RELEASE_HELPER_APP_ID }}
          private-key: ${{ secrets.RELEASE_HELPER_PRIVATE_KEY }}

      - name: Release please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.release-helper.outputs.token }}
          config-file: release-please-config.json
          manifest-file: release-please-manifest.json
